<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
  <title>GooseByte</title>

  <link rel="icon" type="image/png" href="favicon.ico">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo {
      display: block;
      width: 150px;
      height: auto;
      margin: 0 auto 30px auto;
    }

    main {
      max-width: 600px;
      padding: 40px 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    a {
      color: #fff;
      text-decoration: underline;
    }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>

<body>

  <main>
   <img class="logo" src="GBLogo2025.png" alt="GooseByte">
    
    <h1>GooseByte</h1>

    <p>
      GooseByte develops software and digital products,
      including games and applications for mobile devices.
    </p>

    <p>
      <a href="mailto:hello@goosebyte.com">hello@goosebyte.com</a>
    </p>

    <footer>
      © 2026 GooseByte. All rights reserved.
    </footer>
  </main>

</body>
</html>
